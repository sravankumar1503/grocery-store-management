<!DOCTYPE html>
<html>
<head>
    <title>GSMS · Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link media="all" type="text/css" rel="stylesheet" href="css/bootstrap.min.css">
    <link media="all" type="text/css" rel="stylesheet" href="css/app.css?v=1.0">
</head>
<body>

<nav class="app-nav">
    <div class="app-nav-left">
        <a href="index.html" class="app-wordmark">GSMS</a>
        <ul class="app-nav-links">
            <li><a href="index.html" class="active">Dashboard</a></li>
            <li><a href="manage-product.html">Products</a></li>
            <li><a href="order.html">New Order</a></li>
        </ul>
    </div>
    <div class="app-nav-right">
        <span id="loggedInUsername"></span>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</nav>

<div class="app-content">
    <div class="app-card">
        <h1 class="app-page-title">Orders</h1>
        <table class="app-table">
            <thead>
                <th>Date</th>
                <th>Order Number</th>
                <th>Customer Name</th>
                <th>Total Cost</th>
                <th style="width: 100px">Action</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div class="modal fade-scale" id="myModal" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Order Details</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color:#fff; opacity:0.8;"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body text-center" id="orderDetailsModalBody">
                <img src="https://demo.test.cloint.com/assets/images/spinner.gif" width="40" style="margin: 60px auto;" alt="">
            </div>
        </div>
    </div>
</div>

<script src="js/packages/jquery.min.js"></script>
<script src="js/custom/common.js"></script>
<script>requireLogin();</script>
<script src="js/custom/dashboard.js"></script>
<script src="js/packages/bootstrap.min.js"></script>
</body>
</html>
