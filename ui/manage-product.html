<!DOCTYPE html>
<html>
<head>
    <title>GSMS · Products</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link media="all" type="text/css" rel="stylesheet" href="css/bootstrap.min.css">
    <link media="all" type="text/css" rel="stylesheet" href="css/app.css?v=1.0">
</head>
<body>

<nav class="app-nav">
    <div class="app-nav-left">
        <a href="index.html" class="app-wordmark">GSMS</a>
        <ul class="app-nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="manage-product.html" class="active">Products</a></li>
            <li><a href="order.html">New Order</a></li>
        </ul>
    </div>
    <div class="app-nav-right">
        <span id="loggedInUsername"></span>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</nav>

<div class="app-content">
    <div class="app-card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem;">
            <h1 class="app-page-title" style="margin:0;">Products</h1>
            <div>
                <button type="button" class="btn btn-secondary" data-toggle="modal" data-target="#uomModal" style="margin-right:8px;">Add New UOM</button>
                <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#productModal">Add New Product</button>
            </div>
        </div>
                <div class="app-table-scroll">
        <table class="app-table">
            <thead>
                <th>Name</th>
                <th>Unit</th>
                <th>Price Per Unit</th>
                <th style="width: 150px">Action</th>
            </thead>
            <tbody></tbody>
        </table>
        </div>
    </div>
</div>

<div class="modal fade-scale" id="productModal" role="dialog" data-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Add New Product</h4>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" name="id" id="id" value="0">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label>Name</label>
                                <input class="form-control" placeholder="Name" name="name" id="name" type="text" value="">
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label>Unit</label>
                                <select name="uoms" id="uoms" class="form-control"></select>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label>Price Per Unit</label>
                                <input class="form-control" placeholder="Price Per Unit" name="price" id="price" type="text" value="">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="saveProduct">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade-scale" id="uomModal" role="dialog" data-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Add New UOM</h4>
            </div>
            <div class="modal-body">
                <form id="uomForm">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label>UOM Name</label>
                                <input class="form-control" placeholder="e.g. Cubic Meter" name="uom_name" id="uom_name" type="text" value="">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="saveUOM">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="js/packages/jquery.min.js"></script>
<script src="js/custom/common.js"></script>
<script>requireLogin();</script>
<script src="js/custom/manage-product.js"></script>
<script src="js/packages/bootstrap.min.js"></script>
</body>
</html>
