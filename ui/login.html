<!DOCTYPE html>
<html>
<head>
    <title> GSMS - Login </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700">
    <link media="all" type="text/css" rel="stylesheet" href="css/bootstrap.min.css">
    <link media="all" type="text/css" rel="stylesheet" href="css/style.css?v=1.0">
    <link media="all" type="text/css" rel="stylesheet" href="css/custom.css?v=1.3.3">
</head>
<body class="tooltips">
<div class="container">
    <div class="right content-page" style="margin: 60px auto; max-width: 400px; float: none;">
        <div class="body content rows">
            <div class="box-info full" id="taskFormContainer">
                <h2>Login</h2>
                <div id="loginError" class="alert alert-danger" style="display:none;"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input class="form-control" name="username" id="username" type="text" value="">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input class="form-control" name="password" id="password" type="password" value="">
                    </div>
                    <button type="button" class="btn btn-primary btn-block" id="loginButton">Login</button>
                </form>
                <p class="mt-3 text-center">Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
<script src="js/packages/jquery.min.js"></script>
<script src="js/custom/common.js"></script>
<script src="js/custom/login.js"></script>
</body>
</html>
