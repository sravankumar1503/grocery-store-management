<!DOCTYPE html>
<html>
<head>
    <title>GSMS · Log in</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link media="all" type="text/css" rel="stylesheet" href="css/auth.css?v=1.0">
</head>
<body>
<div class="auth-shell">

    <div class="auth-brand">
        <p class="auth-wordmark">GSMS</p>
        <p class="auth-tagline">Every crate counted, every order tallied — your store, kept in one place.</p>
        <div class="auth-features">
            <div class="auth-feature">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>Stock, tracked by the unit</span>
            </div>
            <div class="auth-feature">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6l-1-3H2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
                <span>Orders, from till to total</span>
            </div>
            <div class="auth-feature">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
                <span>A private ledger, just for you</span>
            </div>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-form-card">
            <h1 class="auth-form-heading">Welcome back</h1>
            <p class="auth-form-sub">Log in to pick up where you left the till.</p>

            <div id="loginError" class="auth-error"></div>

            <form id="loginForm">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input name="username" id="username" type="text" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input name="password" id="password" type="password" autocomplete="current-password">
                </div>
                <button type="button" class="auth-submit" id="loginButton">Log in</button>
            </form>

            <p class="auth-switch">New here? <a href="signup.html">Open an account</a></p>
        </div>
    </div>

</div>
<script src="js/packages/jquery.min.js"></script>
<script src="js/custom/common.js"></script>
<script src="js/custom/login.js"></script>
</body>
</html>
