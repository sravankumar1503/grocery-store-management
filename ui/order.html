<!DOCTYPE html>
<html>
<head>
    <title>GSMS · New Order</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link media="all" type="text/css" rel="stylesheet" href="css/bootstrap.min.css">
    <link media="all" type="text/css" rel="stylesheet" href="css/app.css?v=1.0">
</head>
<body>

<nav class="app-nav">
    <div class="app-nav-left">
        <a href="index.html" class="app-wordmark">GSMS</a>
        <ul class="app-nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="manage-product.html">Products</a></li>
            <li><a href="order.html" class="active">New Order</a></li>
        </ul>
    </div>
    <div class="app-nav-right">
        <span id="loggedInUsername"></span>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</nav>

<div class="app-content">
    <form action="">
        <div class="app-card" style="margin-bottom:1.2rem;">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.2rem;">
                <h1 class="app-page-title" style="margin:0;">New Order</h1>
                <input name="customerName" id="customerName" type="text" class="form-control" placeholder="Customer Name" style="max-width:230px;">
            </div>

            <div id="orderFormErrors" class="app-alert"></div>

            <div class="order-header-row">
                <div>Product</div>
                <div>Price</div>
                <div>Quantity</div>
                <div>Total</div>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; margin-bottom:0.8rem;">
            <button class="btn btn-secondary" type="button" id="addMoreButton">+ Add item</button>
        </div>

        <div id="itemsInOrder"></div>

        <div class="order-grand-total">
            <span style="color:var(--ink-soft); font-size:0.9rem;">Total</span>
            <input id="product_grand_total" name="product_grand_total" class="product-grand-total" value="0.0">
            <span style="color:var(--ink-soft); font-size:0.9rem;">Rs</span>
            <button class="btn btn-primary" type="button" id="saveOrder">Save order</button>
        </div>
    </form>

    <div class="product-box hidden">
        <div class="order-item-row product-item">
            <div class="item-product">
                <select name="product" class="form-control cart-product"></select>
            </div>
            <div class="item-price">
                <input id="product_price" name="product_price" class="product-price form-control" value="0.0">
            </div>
            <div class="item-qty">
                <input name="qty" type="number" min="1" placeholder="" class="form-control product-qty" value="1">
            </div>
            <div class="item-total-col">
                <input id="item_total" name="item_total" class="product-total form-control" value="0.0">
                <span style="color:var(--ink-soft); font-size:0.85rem;">Rs</span>
                <button class="btn btn-danger btn-sm remove-row" type="button">Remove</button>
            </div>
        </div>
    </div>
</div>

<script src="js/packages/jquery.min.js"></script>
<script src="js/custom/common.js"></script>
<script>requireLogin();</script>
<script src="js/custom/order.js"></script>
<script src="js/packages/bootstrap.min.js"></script>
</body>
</html>
